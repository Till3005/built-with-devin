<!doctype html>
<html data-theme="light"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/site.css">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{background:rgb(var(--bg-page))}
  /* hairline frame, devin.ai editorial style */
  .frame{position:absolute;inset:24px;border:1px solid rgb(var(--line));box-sizing:border-box;
         display:flex;flex-direction:column}
  .cv-main{flex:1;display:flex;align-items:center;padding:0 72px;gap:48px}
  .cv-left{flex:1;display:flex;flex-direction:column;gap:26px}
  .cv-eyebrow{font:500 13px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:rgb(var(--ink-3))}
  .cv-brand{display:flex;align-items:baseline;gap:6px}
  .cv-brand .bt{font:600 52px var(--sans);letter-spacing:-.025em;color:rgb(var(--ink))}
  .cv-brand img{height:44px;transform:translateY(6px);margin-left:2px}
  .cv-chip{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;
           color:rgb(var(--ink-3));border:1px solid rgb(var(--line));border-radius:999px;
           padding:5px 12px;margin-left:14px;transform:translateY(-8px)}
  .cv-tag{font:400 italic 27px/1.5 var(--serif);color:rgb(var(--ink-2));max-width:540px}
  .cv-right{width:400px;height:400px;flex:none}
  .cv-foot{border-top:1px solid rgb(var(--line));display:flex;justify-content:space-between;
           align-items:center;padding:18px 72px}
  .cv-sub{font:400 13px var(--mono);letter-spacing:.06em;color:rgb(var(--ink-3))}
  .cv-meta{font:400 13px var(--mono);letter-spacing:.06em;color:rgb(var(--ink-3))}
  [data-theme="dark"] .cv-brand img{filter:invert(.94)}
</style>
</head><body>
<div class="frame">
  <div class="cv-main">
    <div class="cv-left">
      <div class="cv-eyebrow" id="eyebrow">Community-made · Unofficial registry</div>
      <div class="cv-brand"><span class="bt" id="bt">built-with-</span><img src="assets/brand/Devin_Primary_Logo.svg" alt="Devin"><span class="cv-chip">unofficial</span></div>
      <div class="cv-tag" id="tag">Everything built with Devin, verified — every figure links to its source.</div>
    </div>
    <div class="cv-right"><div class="hero-media"><div class="media-panel" style="width:400px;height:400px"></div></div></div>
  </div>
  <div class="cv-foot">
    <span class="cv-sub" id="sub">github.com/Till3005/built-with-devin</span>
    <span class="cv-meta" id="meta">11 bots · 33 enterprises · 28 tools · 19 reports</span>
  </div>
</div>
<script>
  const q=new URLSearchParams(location.search);
  if(q.has('dark'))document.documentElement.dataset.theme='dark';
  if(q.get('repo')==='build'){
    bt.textContent='build-with-';
    eyebrow.textContent='Community-made · Unofficial tutorials';
    tag.textContent='Fifteen field-tested guides — every pattern reverse-engineered from a named deployment.';
    sub.textContent='github.com/Till3005/build-with-devin';
    meta.textContent='15 guides · 3 tracks · 6 languages';
  }
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="assets/hero3d.js"></script>
</body></html>
