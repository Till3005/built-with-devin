<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Built with Devin" }}</title>
<link rel="icon" href="{{ "/assets/devin-symbol.svg" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/site.css" | relative_url }}">
<script src="{{ "/assets/theme.js" | relative_url }}" defer></script>
<style>
  main{padding:56px 0 24px;max-width:780px}
  main h1{font:400 clamp(34px,5vw,52px)/1.08 var(--serif);letter-spacing:-.02em;margin-bottom:20px}
  main h2{font:400 30px/1.15 var(--serif);letter-spacing:-.02em;margin:52px 0 16px;padding-top:28px;border-top:1px solid var(--line)}
  main h3{font:600 17px var(--sans);margin:32px 0 10px}
  main p{margin:14px 0}
  main ul,main ol{margin:14px 0 14px 22px}
  main li{margin:6px 0}
  main a{color:var(--acc);text-decoration:none}
  main a:hover{text-decoration:underline}
  main strong{font-weight:600}
  main code{font:13px var(--mono);background:var(--panel);border:1px solid var(--line);padding:2px 6px;border-radius:4px}
  main pre{background:var(--panel);border:1px solid var(--line);padding:18px 20px;border-radius:8px;overflow-x:auto;margin:16px 0}
  main pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.6}
  main blockquote{border-left:2px solid var(--acc);padding:4px 0 4px 18px;margin:16px 0;color:var(--mut)}
  main table{margin:20px 0}
  main hr{border:none;border-top:1px solid var(--line);margin:40px 0}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="./index.html"><img src="{{ "/assets/brand/Devin_Symbol.svg" | relative_url }}" alt="" width="20"> Built with Devin</a>
  <div class="navlinks">
    <a href="./index.html#deployments">Deployments</a>
    <a href="./index.html#enterprise">Enterprise</a>
    <a href="./index.html#tools">Tools</a>
    <a href="./economics.html">Economics</a>
    <a href="https://github.com/Till3005/build-with-devin">Tutorials</a>
  </div>
  <div class="nav-side">
    <button id="theme-toggle" aria-label="Toggle theme"></button>
    <a class="cta" href="https://github.com/Till3005/built-with-devin">GitHub</a>
  </div>
</div></nav>
<div class="wrap"><main>
{{ content }}
<hr>
<p><a href="./index.html">← Back to the registry</a> · <a href="https://github.com/Till3005/built-with-devin">GitHub</a></p>
</main></div>
</body>
</html>
