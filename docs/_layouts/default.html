<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Built with Devin" }}</title>
{% seo %}
<link rel="icon" href="{{ "/assets/brand/Devin_Symbol.svg" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/site.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/guides.css" | relative_url }}">
</head>
<body>
<a class="skip" href="#page">Skip to content</a>
<nav><div class="wrap nav-inner">
  <div class="nav-left">
    <a class="brand" href="{{ "/index.html" | relative_url }}" aria-label="Built with Devin">
      <span class="brand-text">built<strong>-with-</strong></span><img class="brand-mark" src="{{ "/assets/brand/Devin_Primary_Logo.svg" | relative_url }}" alt="Devin" height="16"><span class="unofficial-chip">unofficial</span>
    </a>
  </div>
  <div class="nav-side">
    <div class="mode-toggle" role="tablist" aria-label="Site section">
      <button class="mode-btn on" data-mode="built" role="tab" aria-selected="true" onclick="location.href='{{ "/index.html" | relative_url }}'">Built</button>
      <button class="mode-btn" data-mode="build" role="tab" aria-selected="false" onclick="location.href='{{ "/index.html#build" | relative_url }}'">Build</button>
      <span class="mode-pill" aria-hidden="true"></span>
    </div>
    <button id="theme-toggle" aria-label="Toggle theme"></button>
    <a class="cta" href="https://github.com/Till3005/built-with-devin">GitHub</a>
  </div>
</div></nav>
<main>
<article class="guide wrap" id="page">
{{ content }}
<hr>
<p><a href="{{ "/index.html" | relative_url }}">← built-with-devin</a> · <a href="https://github.com/Till3005/build-with-devin">build-with-devin</a></p>
</article>
<footer><div class="wrap foot-base"><span data-i18n="foot.note">Unofficial community project — not affiliated with Cognition AI.</span><span><a href="{{ "/index.html" | relative_url }}">built-with-devin</a> · <a href="https://github.com/Till3005/build-with-devin">build-with-devin</a></span></div></footer>
</main>
<script src="{{ "/assets/theme.js" | relative_url }}"></script>
<script src="{{ "/assets/i18n.js" | relative_url }}"></script>
<script src="{{ "/assets/i18n-runtime.js" | relative_url }}"></script>
</body>
</html>
